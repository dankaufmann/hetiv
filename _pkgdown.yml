url: https://dankaufmann.github.io/hetiv/

home:
  title: hetiv
  description: Heteroskedasticity and Proxy-Based IV Methods

template:
  bootstrap: 5
  math-rendering: mathjax
  light-switch: true

authors:
  Daniel Kaufmann:
    href: https://dankaufmann.com
  Marc Burri:
    href: https://marcburri.github.io
  Valentin Grob: {}

reference:
  - title: Estimation
    desc: Estimate impulse response functions via IV local projections or a proxy SVAR
    contents:
      - hetiv
      - proxyiv
      - recols
      - svariv
  - title: Weak instrument test
    desc: Test for weak instruments (Lewis-Mertens 2025)
    contents:
      - gweakivtest
  - title: Shock extraction and IRF computation
    contents:
      - predict_shocks
      - prediction_corr
      - computeirf
  - title: Proxies and model specification
    desc: Construct surprise factors and choose the lag length
    contents:
      - gss_pca
      - lag_opt
  - title: Plotting
    contents:
      - plotirf
      - plot2irf
      - plotpval
      - arrangeirf
      - plotseries
  - title: Simulation
    contents:
      - simulatedata
  - title: Utilities
    contents:
      - normalize
      - logdiff
      - firstdiff
      - filllinear
      - rescale_to_match
